<script>
'use strict';
const DEFAULT_CARDS=[{"id":"biz-001","term":"アジェンダ","definition":"会議で扱う議題と進める順番。","example":"明日の定例会議のアジェンダを先に共有します。","category":"会議・連絡"},{"id":"biz-002","term":"アサイン","definition":"担当業務や役割を人に割り当てること。","example":"新しい案件の窓口に私をアサインしてください。","category":"会議・連絡"},{"id":"biz-003","term":"リスケ","definition":"予定していた日時や計画を組み直すこと。","example":"広告主との打ち合わせを来週にリスケします。","category":"会議・連絡"},{"id":"biz-004","term":"ペンディング","definition":"判断や作業を一時的に保留すること。","example":"報酬条件が未確定なので提案をペンディングにします。","category":"会議・連絡"},{"id":"biz-005","term":"フィックス","definition":"内容や日程を最終的に確定すること。","example":"掲載条件がフィックスしたら媒体に連絡します。","category":"会議・連絡"},{"id":"biz-006","term":"エスカレーション","definition":"自分だけでは判断できない問題を上司や責任者に報告・相談すること。","example":"規約変更の相談が来たので上長にエスカレーションします。","category":"会議・連絡"},{"id":"biz-007","term":"リマインド","definition":"予定や依頼を改めて知らせること。","example":"回答期限の前日に担当者へリマインドします。","category":"会議・連絡"},{"id":"biz-008","term":"フィードバック","definition":"成果や提案について評価や改善点を伝えること。","example":"営業資料にフィードバックをお願いします。","category":"会議・連絡"},{"id":"biz-009","term":"コンセンサス","definition":"関係者の間で意見や方針について合意していること。","example":"新しい手数料率について社内のコンセンサスを得ます。","category":"会議・連絡"},{"id":"biz-010","term":"ブレスト","definition":"自由にアイデアを出し合う話し合い。","example":"新しい提案の切り口をブレストで考えましょう。","category":"会議・連絡"},{"id":"biz-011","term":"ファシリテーション","definition":"会議の進行を助け、話し合いを促すこと。","example":"議論が脱線しないようファシリテーションを担当します。","category":"会議・連絡"},{"id":"biz-012","term":"キックオフ","definition":"新しい案件を始めるときの初回の集まり。","example":"案件開始前に関係者でキックオフを行います。","category":"会議・連絡"},{"id":"biz-013","term":"ネクストアクション","definition":"会議や作業の後、次に実行する具体的な行動。","example":"商談後のネクストアクションは掲載条件の再確認です。","category":"会議・連絡"},{"id":"biz-014","term":"キャッチアップ","definition":"新しい情報や遅れていた状況を把握して追いつくこと。","example":"昨日までの案件の進捗をキャッチアップします。","category":"会議・連絡"},{"id":"biz-015","term":"アナウンス","definition":"決まった内容や変更点を関係者に知らせること。","example":"管理画面の更新予定を媒体へアナウンスします。","category":"会議・連絡"},{"id":"biz-016","term":"アラインメント","definition":"関係者の目的・方針・認識をそろえること。","example":"営業と運用で目標のアラインメントを取ります。","category":"会議・連絡"},{"id":"biz-017","term":"ナレッジ","definition":"業務で得た知識・経験・ノウハウ。","example":"媒体審査で得たナレッジをチームで共有します。","category":"会議・連絡"},{"id":"biz-018","term":"エビデンス","definition":"説明や判断の根拠になる証拠・資料・記録。","example":"成果の発生状況を示すエビデンスを保存します。","category":"会議・連絡"},{"id":"biz-019","term":"ステークホルダー","definition":"案件に関係し、影響を受ける人や組織。","example":"変更前に主要なステークホルダーに確認します。","category":"会議・連絡"},{"id":"biz-020","term":"レポーティング","definition":"業務の状況や成果を整理して報告すること。","example":"週次のレポーティングで獲得件数の変化を説明します。","category":"会議・連絡"},{"id":"biz-021","term":"タスク","definition":"達成するために行う個々の作業。","example":"今日中に対応するタスクを3件整理します。","category":"業務進行"},{"id":"biz-022","term":"デッドライン","definition":"作業や提出を終えなければならない期限。","example":"資料提出のデッドラインは金曜日です。","category":"業務進行"},{"id":"biz-023","term":"マイルストーン","definition":"計画途中で達成状況を確認する重要な節目。","example":"今月末を媒体10社獲得のマイルストーンにします。","category":"業務進行"},{"id":"biz-024","term":"ガントチャート","definition":"作業の予定と進捗を横棒で示す管理表。","example":"ガントチャートで案件公開までの予定を確認します。","category":"業務進行"},{"id":"biz-025","term":"WBS","definition":"仕事を小さな作業単位に分けた一覧や構成表。","example":"WBSを作り、案件公開に必要な作業を洗い出します。","category":"業務進行"},{"id":"biz-026","term":"リードタイム","definition":"依頼や発注から完了までにかかる時間。","example":"素材の制作リードタイムを確認して納期を決めます。","category":"業務進行"},{"id":"biz-027","term":"ボトルネック","definition":"全体の進行や成果を妨げている要因や工程。","example":"審査待ちが掲載開始のボトルネックです。","category":"業務進行"},{"id":"biz-028","term":"プライオリティ","definition":"複数の仕事を行う際の優先順位。","example":"緊急の問い合わせのプライオリティを上げます。","category":"業務進行"},{"id":"biz-029","term":"リソース","definition":"仕事に使える人員・時間・予算などの資源。","example":"新案件を増やす前に運用のリソースを確認します。","category":"業務進行"},{"id":"biz-030","term":"キャパシティ","definition":"人や組織が対応できる業務量の限界や余力。","example":"今週はチームのキャパシティに余裕がありません。","category":"業務進行"},{"id":"biz-031","term":"ロードマップ","definition":"目標達成までの大まかな計画と時系列。","example":"サービス改善のロードマップを共有します。","category":"業務進行"},{"id":"biz-032","term":"スコープ","definition":"業務やプロジェクトで対応する範囲。","example":"今回の提案のスコープは新規媒体の開拓までです。","category":"業務進行"},{"id":"biz-033","term":"スコープクリープ","definition":"途中で合意した業務範囲が少しずつ広がること。","example":"追加依頼によるスコープクリープを防ぎます。","category":"業務進行"},{"id":"biz-034","term":"オーナー","definition":"作業や案件の進行に責任を持つ担当者。","example":"各タスクのオーナーを決めておきます。","category":"業務進行"},{"id":"biz-035","term":"ワークフロー","definition":"仕事を進める手順や承認の流れ。","example":"成果承認のワークフローを見直します。","category":"業務進行"},{"id":"biz-036","term":"オンボーディング","definition":"新しい人や利用者が仕事・サービスに慣れるための支援。","example":"入社後のオンボーディングで操作方法を学びます。","category":"業務進行"},{"id":"biz-037","term":"オペレーション","definition":"日々の業務を実行・運用することやその手順。","example":"媒体登録のオペレーションを簡単にします。","category":"業務進行"},{"id":"biz-038","term":"レビュー","definition":"内容や成果を確認し、評価・修正すること。","example":"提案書を送る前に上司のレビューを受けます。","category":"業務進行"},{"id":"biz-039","term":"リスクヘッジ","definition":"予想される問題に備えて影響を抑えること。","example":"掲載遅延のリスクヘッジとして代替媒体も探します。","category":"業務進行"},{"id":"biz-040","term":"イテレーション","definition":"試作・実施・改善を繰り返す一回ごとの反復。","example":"最初のイテレーションで見つかった課題を次回に直します。","category":"業務進行"},{"id":"biz-041","term":"リード","definition":"自社の商品やサービスに関心を持つ見込み顧客。","example":"展示会で得たリードに後日連絡します。","category":"営業・取引"},{"id":"biz-042","term":"プロスペクト","definition":"取引の可能性が高いと見込まれる具体的な営業先。","example":"条件が合うプロスペクトから優先して商談します。","category":"営業・取引"},{"id":"biz-043","term":"アポイント","definition":"商談や打ち合わせを行う約束。","example":"広告主とのアポイントを来週の火曜日に取りました。","category":"営業・取引"},{"id":"biz-044","term":"ヒアリング","definition":"相手の状況・課題・要望を質問して聞き取ること。","example":"提案前のヒアリングで希望する成果条件を確認します。","category":"営業・取引"},{"id":"biz-045","term":"ニーズ","definition":"顧客が必要としていることや満たしたい要望。","example":"媒体のニーズに合わせて案件を紹介します。","category":"営業・取引"},{"id":"biz-046","term":"ペインポイント","definition":"顧客が困っていることや不満に感じている点。","example":"連絡の遅さがペインポイントになっています。","category":"営業・取引"},{"id":"biz-047","term":"ソリューション","definition":"課題を解決するための商品・サービス・方法。","example":"問い合わせ対応を減らすソリューションを提案します。","category":"営業・取引"},{"id":"biz-048","term":"ピッチ","definition":"提案内容を短時間で要点を絞って伝えること。","example":"新サービスを3分のピッチで紹介します。","category":"営業・取引"},{"id":"biz-049","term":"コンペ","definition":"複数の会社が提案を競い、発注先などを決める方式。","example":"広告運用会社の選定コンペに参加します。","category":"営業・取引"},{"id":"biz-050","term":"クロージング","definition":"商談を最終的な契約や受注に結びつけること。","example":"条件を確認したらクロージングに進みます。","category":"営業・取引"},{"id":"biz-051","term":"ネゴシエーション","definition":"条件や価格などについて相手と交渉すること。","example":"掲載単価についてネゴシエーションします。","category":"営業・取引"},{"id":"biz-052","term":"マージン","definition":"取引金額に含まれる手数料や利益の幅。","example":"媒体報酬を決める前にマージンを確認します。","category":"営業・取引"},{"id":"biz-053","term":"グロス","definition":"手数料や費用を差し引く前の総額。","example":"グロスの金額で広告主への請求額を整理します。","category":"営業・取引"},{"id":"biz-054","term":"ネット","definition":"取引上、手数料などを差し引いた後の金額。","example":"媒体への支払条件をネットの金額で確認します。","category":"営業・取引"},{"id":"biz-055","term":"アップセル","definition":"顧客に今より高額・上位の商品を提案すること。","example":"追加機能のあるプランへアップセルを提案します。","category":"営業・取引"},{"id":"biz-056","term":"クロスセル","definition":"顧客に関連する別の商品やサービスも提案すること。","example":"運用支援に加えて制作支援のクロスセルを検討します。","category":"営業・取引"},{"id":"biz-057","term":"リテンション","definition":"既存顧客との取引やサービス利用を維持すること。","example":"リテンション向上のために定期面談を続けます。","category":"営業・取引"},{"id":"biz-058","term":"チャーン","definition":"顧客が契約やサービス利用をやめること。","example":"サービスのチャーンを減らす施策を考えます。","category":"営業・取引"},{"id":"biz-059","term":"パイプライン","definition":"営業案件を見込みから受注まで段階別に管理したもの。","example":"今月のパイプラインを確認して売上見込みを出します。","category":"営業・取引"},{"id":"biz-060","term":"タッチポイント","definition":"顧客と会社・サービスが接する機会や接点。","example":"初回問い合わせのタッチポイントを改善します。","category":"営業・取引"},{"id":"biz-061","term":"KPI","definition":"目標達成に向けた途中経過を測る重要指標。","example":"新規媒体への提案件数をKPIとして追います。","category":"数字・経営"},{"id":"biz-062","term":"KGI","definition":"事業や活動で最終的に達成したい目標を示す指標。","example":"今期の売上目標をKGIとして設定します。","category":"数字・経営"},{"id":"biz-063","term":"OKR","definition":"挑戦的な目標と達成を測る主要な結果を組み合わせた管理方法。","example":"OKRを使ってチームの重点目標をそろえます。","category":"数字・経営"},{"id":"biz-064","term":"ROI","definition":"投資額に対してどれだけ利益が得られたかを示す指標。","example":"新ツール導入のROIを試算します。","category":"数字・経営"},{"id":"biz-065","term":"キャッシュフロー","definition":"一定期間の現金の入りと出の動き。","example":"入金と支払いの時期からキャッシュフローを確認します。","category":"数字・経営"},{"id":"biz-066","term":"P/L","definition":"損益計算書。一定期間の売上・費用・利益を示す書類。","example":"月次のP/Lで利益が出ているか確認します。","category":"数字・経営"},{"id":"biz-067","term":"B/S","definition":"貸借対照表。ある時点の資産・負債・純資産を示す書類。","example":"決算のB/Sを見て財務状況を確認します。","category":"数字・経営"},{"id":"biz-068","term":"グロスプロフィット","definition":"売上高から売上原価を差し引いた利益。売上総利益。","example":"グロスプロフィットの推移を月ごとに比較します。","category":"数字・経営"},{"id":"biz-069","term":"コスト","definition":"事業や業務を行うために必要な費用。","example":"広告素材の制作コストを見直します。","category":"数字・経営"},{"id":"biz-070","term":"イニシャルコスト","definition":"導入や立ち上げの最初にかかる費用。","example":"システム導入のイニシャルコストを見積もります。","category":"数字・経営"},{"id":"biz-071","term":"ランニングコスト","definition":"運用や利用を続けるために継続的にかかる費用。","example":"月額のランニングコストも予算に含めます。","category":"数字・経営"},{"id":"biz-072","term":"ブレークイーブン","definition":"収益と費用が等しくなり損益がゼロになる点。","example":"新サービスのブレークイーブンを計算します。","category":"数字・経営"},{"id":"biz-073","term":"バジェット","definition":"業務や事業に割り当てられた予算。","example":"この施策に使えるバジェットを確認します。","category":"数字・経営"},{"id":"biz-074","term":"フォーキャスト","definition":"今後の売上や業績についての予測値。","example":"来月のフォーキャストを更新します。","category":"数字・経営"},{"id":"biz-075","term":"アクチュアル","definition":"予測ではなく実際に発生した実績値。","example":"フォーキャストとアクチュアルを比較します。","category":"数字・経営"},{"id":"biz-076","term":"バリアンス","definition":"予算と実績など二つの数値の差異。","example":"売上のバリアンスが大きい原因を調べます。","category":"数字・経営"},{"id":"biz-077","term":"ランウェイ","definition":"手元の現金で事業を続けられる見込み期間。","example":"固定費を考慮して事業のランウェイを計算します。","category":"数字・経営"},{"id":"biz-078","term":"バーンレート","definition":"一定期間に事業で現金を消費する速さ・金額。","example":"毎月のバーンレートを抑える施策を検討します。","category":"数字・経営"},{"id":"biz-079","term":"ユニットエコノミクス","definition":"顧客一人や取引一件あたりの収益性を評価する考え方。","example":"一顧客あたりのユニットエコノミクスを確認します。","category":"数字・経営"},{"id":"biz-080","term":"LTV","definition":"一人の顧客が取引期間全体を通じてもたらす価値。","example":"契約継続率を改善してLTVを高めます。","category":"数字・経営"},{"id":"biz-081","term":"PDCA","definition":"計画・実行・評価・改善を繰り返す仕事の進め方。","example":"PDCAを回して提案資料を改善します。","category":"企画・戦略"},{"id":"biz-082","term":"OODA","definition":"観察・状況判断・意思決定・行動の流れで判断する考え方。","example":"変化が速い案件ではOODAで素早く動きます。","category":"企画・戦略"},{"id":"biz-083","term":"SWOT分析","definition":"強み・弱み・機会・脅威から状況を整理する分析。","example":"競合との違いをSWOT分析で整理します。","category":"企画・戦略"},{"id":"biz-084","term":"3C分析","definition":"顧客・競合・自社の三つの視点で状況を考える分析。","example":"3C分析をして営業戦略を考えます。","category":"企画・戦略"},{"id":"biz-085","term":"STP","definition":"市場の細分化・対象顧客の選定・自社の立ち位置を決める考え方。","example":"新サービスのSTPを整理します。","category":"企画・戦略"},{"id":"biz-086","term":"ペルソナ","definition":"代表的な顧客像を具体的な人物像として設定したもの。","example":"想定する担当者のペルソナを作ります。","category":"企画・戦略"},{"id":"biz-087","term":"カスタマージャーニー","definition":"顧客が認知から購入・利用に至るまでの体験の流れ。","example":"カスタマージャーニーをもとに案内内容を考えます。","category":"企画・戦略"},{"id":"biz-088","term":"ベンチマーク","definition":"比較や目標設定の基準となる数値・企業・事例。","example":"同規模の会社をベンチマークにして目標を立てます。","category":"企画・戦略"},{"id":"biz-089","term":"ポジショニング","definition":"市場や顧客の中で自社をどう位置付けるかを決めること。","example":"競合と差別化できるポジショニングを考えます。","category":"企画・戦略"},{"id":"biz-090","term":"バリュープロポジション","definition":"顧客に提供する独自の価値を表すもの。","example":"サービスのバリュープロポジションを整理します。","category":"企画・戦略"},{"id":"biz-091","term":"アウトプット","definition":"作業の結果として作った資料や成果物など。","example":"会議のアウトプットとして提案書を完成させます。","category":"企画・戦略"},{"id":"biz-092","term":"アウトカム","definition":"活動によって実際に生まれた変化や効果。","example":"資料を配るだけでなく受注というアウトカムを確認します。","category":"企画・戦略"},{"id":"biz-093","term":"イシュー","definition":"解決・判断すべき重要な論点や問題。","example":"今週のイシューは媒体の掲載率を上げることです。","category":"企画・戦略"},{"id":"biz-094","term":"インサイト","definition":"データや観察から得られる表面には見えにくい重要な気づき。","example":"利用者の行動データから新しいインサイトを探します。","category":"企画・戦略"},{"id":"biz-095","term":"アサンプション","definition":"計画や試算の前提として置く仮定。","example":"売上予測のアサンプションを明確にします。","category":"企画・戦略"},{"id":"biz-096","term":"プロトタイプ","definition":"本格開発前に試す試作品や初期モデル。","example":"画面のプロトタイプを作って使いやすさを確認します。","category":"企画・戦略"},{"id":"biz-097","term":"PoC","definition":"アイデアや技術が実現できるか小規模に検証すること。","example":"新機能を導入する前にPoCを実施します。","category":"企画・戦略"},{"id":"biz-098","term":"MVP","definition":"必要最小限の機能だけを持ち利用者に試してもらう製品。","example":"まずMVPを公開して利用者の反応を集めます。","category":"企画・戦略"},{"id":"biz-099","term":"ピボット","definition":"状況を踏まえて事業・製品の方向性を大きく変えること。","example":"需要が少なければピボットを検討します。","category":"企画・戦略"},{"id":"biz-100","term":"スケール","definition":"事業や仕組みをより大きな規模へ拡大すること。","example":"運用手順を整えてからサービスをスケールさせます。","category":"企画・戦略"}];
const CATEGORY_OPTIONS=["会議・連絡","業務進行","営業・取引","数字・経営","企画・戦略"];

</script>
