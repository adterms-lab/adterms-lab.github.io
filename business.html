<script>
'use strict';
const DEFAULT_CARDS=[{"id":"biz-001","term":"アジェンダ","definition":"会議で扱う議題と進める順番。","example":"明日の定例会議のアジェンダを先に共有します。","category":"会議・連絡"},{"id":"biz-002","term":"アサイン","definition":"担当業務や役割を人に割り当てること。","example":"新しい案件の窓口に私をアサインしてください。","category":"会議・連絡"},{"id":"biz-003","term":"リスケ","definition":"予定していた日時や計画を組み直すこと。","example":"広告主との打ち合わせを来週にリスケします。","category":"会議・連絡"},{"id":"biz-004","term":"ペンディング","definition":"判断や作業を一時的に保留すること。","example":"報酬条件が未確定なので提案をペンディングにします。","category":"会議・連絡"},{"id":"biz-005","term":"フィックス","definition":"内容や日程を最終的に確定すること。","example":"掲載条件がフィックスしたら媒体に連絡します。","category":"会議・連絡"},{"id":"biz-006","term":"エスカレーション","definition":"自分だけでは判断できない問題を上司や責任者に報告・相談すること。","example":"規約変更の相談が来たので上長にエスカレーションします。","category":"会議・連絡"},{"id":"biz-007","term":"リマインド","definition":"予定や依頼を改めて知らせること。","example":"回答期限の前日に担当者へリマインドします。","category":"会議・連絡"},{"id":"biz-008","term":"フィードバック","definition":"成果や提案について評価や改善点を伝えること。","example":"営業資料にフィードバックをお願いします。","category":"会議・連絡"},{"id":"biz-009","term":"コンセンサス","definition":"関係者の間で意見や方針について合意していること。","example":"新しい手数料率について社内のコンセンサスを得ます。","category":"会議・連絡"},{"id":"biz-010","term":"ブレスト","definition":"自由にアイデアを出し合う話し合い。","example":"新しい提案の切り口をブレストで考えましょう。","category":"会議・連絡"},{"id":"biz-011","term":"ファシリテーション","definition":"会議の進行を助け、話し合いを促すこと。","example":"議論が脱線しないようファシリテーションを担当します。","category":"会議・連絡"},{"id":"biz-012","term":"キックオフ","definition":"新しい案件を始めるときの初回の集まり。","example":"案件開始前に関係者でキックオフを行います。","category":"会議・連絡"},{"id":"biz-013","term":"ネクストアクション","definition":"会議や作業の後、次に実行する具体的な行動。","example":"商談後のネクストアクションは掲載条件の再確認です。","category":"会議・連絡"},{"id":"biz-014","term":"キャッチアップ","definition":"新しい情報や遅れていた状況を把握して追いつくこと。","example":"昨日までの案件の進捗をキャッチアップします。","category":"会議・連絡"},{"id":"biz-015","term":"アナウンス","definition":"決まった内容や変更点を関係者に知らせること。","example":"管理画面の更新予定を媒体へアナウンスします。","category":"会議・連絡"},{"id":"biz-016","term":"アラインメント","definition":"関係者の目的・方針・認識をそろえること。","example":"営業と運用で目標のアラインメントを取ります。","category":"会議・連絡"},{"id":"biz-017","term":"ナレッジ","definition":"業務で得た知識・経験・ノウハウ。","example":"媒体審査で得たナレッジをチームで共有します。","category":"会議・連絡"},{"id":"biz-018","term":"エビデンス","definition":"説明や判断の根拠になる証拠・資料・記録。","example":"成果の発生状況を示すエビデンスを保存します。","category":"会議・連絡"},{"id":"biz-019","term":"ステークホルダー","definition":"案件に関係し、影響を受ける人や組織。","example":"変更前に主要なステークホルダーに確認します。","category":"会議・連絡"},{"id":"biz-020","term":"レポーティング","definition":"業務の状況や成果を整理して報告すること。","example":"週次のレポーティングで獲得件数の変化を説明します。","category":"会議・連絡"},{"id":"biz-021","term":"タスク","definition":"達成するために行う個々の作業。","example":"今日中に対応するタスクを3件整理します。","category":"業務進行"},{"id":"biz-022","term":"デッドライン","definition":"作業や提出を終えなければならない期限。","example":"資料提出のデッドラインは金曜日です。","category":"業務進行"},{"id":"biz-023","term":"マイルストーン","definition":"計画途中で達成状況を確認する重要な節目。","example":"今月末を媒体10社獲得のマイルストーンにします。","category":"業務進行"},{"id":"biz-024","term":"ガントチャート","definition":"作業の予定と進捗を横棒で示す管理表。","example":"ガントチャートで案件公開までの予定を確認します。","category":"業務進行"},{"id":"biz-025","term":"WBS","definition":"仕事を小さな作業単位に分けた一覧や構成表。","example":"WBSを作り、案件公開に必要な作業を洗い出します。","category":"業務進行"},{"id":"biz-026","term":"リードタイム","definition":"依頼や発注から完了までにかかる時間。","example":"素材の制作リードタイムを確認して納期を決めます。","category":"業務進行"},{"id":"biz-027","term":"ボトルネック","definition":"全体の進行や成果を妨げている要因や工程。","example":"審査待ちが掲載開始のボトルネックです。","category":"業務進行"},{"id":"biz-028","term":"プライオリティ","definition":"複数の仕事を行う際の優先順位。","example":"緊急の問い合わせのプライオリティを上げます。","category":"業務進行"},{"id":"biz-029","term":"リソース","definition":"仕事に使える人員・時間・予算などの資源。","example":"新案件を増やす前に運用のリソースを確認します。","category":"業務進行"},{"id":"biz-030","term":"キャパシティ","definition":"人や組織が対応できる業務量の限界や余力。","example":"今週はチームのキャパシティに余裕がありません。","category":"業務進行"},{"id":"biz-031","term":"ロードマップ","definition":"目標達成までの大まかな計画と時系列。","example":"サービス改善のロードマップを共有します。","category":"業務進行"},{"id":"biz-032","term":"スコープ","definition":"業務やプロジェクトで対応する範囲。","example":"今回の提案のスコープは新規媒体の開拓までです。","category":"業務進行"},{"id":"biz-033","term":"スコープクリープ","definition":"途中で合意した業務範囲が少しずつ広がること。","example":"追加依頼によるスコープクリープを防ぎます。","category":"業務進行"},{"id":"biz-034","term":"オーナー","definition":"作業や案件の進行に責任を持つ担当者。","example":"各タスクのオーナーを決めておきます。","category":"業務進行"},{"id":"biz-035","term":"ワークフロー","definition":"仕事を進める手順や承認の流れ。","example":"成果承認のワークフローを見直します。","category":"業務進行"},{"id":"biz-036","term":"オンボーディング","definition":"新しい人や利用者が仕事・サービスに慣れるための支援。","example":"入社後のオンボーディングで操作方法を学びます。","category":"業務進行"},{"id":"biz-037","term":"オペレーション","definition":"日々の業務を実行・運用することやその手順。","example":"媒体登録のオペレーションを簡単にします。","category":"業務進行"},{"id":"biz-038","term":"レビュー","definition":"内容や成果を確認し、評価・修正すること。","example":"提案書を送る前に上司のレビューを受けます。","category":"業務進行"},{"id":"biz-039","term":"リスクヘッジ","definition":"予想される問題に備えて影響を抑えること。","example":"掲載遅延のリスクヘッジとして代替媒体も探します。","category":"業務進行"},{"id":"biz-040","term":"イテレーション","definition":"試作・実施・改善を繰り返す一回ごとの反復。","example":"最初のイテレーションで見つかった課題を次回に直します。","category":"業務進行"},{"id":"biz-041","term":"リード","definition":"自社の商品やサービスに関心を持つ見込み顧客。","example":"展示会で得たリードに後日連絡します。","category":"営業・取引"},{"id":"biz-042","term":"プロスペクト","definition":"取引の可能性が高いと見込まれる具体的な営業先。","example":"条件が合うプロスペクトから優先して商談します。","category":"営業・取引"},{"id":"biz-043","term":"アポイント","definition":"商談や打ち合わせを行う約束。","example":"広告主とのアポイントを来週の火曜日に取りました。","category":"営業・取引"},{"id":"biz-044","term":"ヒアリング","definition":"相手の状況・課題・要望を質問して聞き取ること。","example":"提案前のヒアリングで希望する成果条件を確認します。","category":"営業・取引"},{"id":"biz-045","term":"ニーズ","definition":"顧客が必要としていることや満たしたい要望。","example":"媒体のニーズに合わせて案件を紹介します。","category":"営業・取引"},{"id":"biz-046","term":"ペインポイント","definition":"顧客が困っていることや不満に感じている点。","example":"連絡の遅さがペインポイントになっています。","category":"営業・取引"},{"id":"biz-047","term":"ソリューション","definition":"課題を解決するための商品・サービス・方法。","example":"問い合わせ対応を減らすソリューションを提案します。","category":"営業・取引"},{"id":"biz-048","term":"ピッチ","definition":"提案内容を短時間で要点を絞って伝えること。","example":"新サービスを3分のピッチで紹介します。","category":"営業・取引"},{"id":"biz-049","term":"コンペ","definition":"複数の会社が提案を競い、発注先などを決める方式。","example":"広告運用会社の選定コンペに参加します。","category":"営業・取引"},{"id":"biz-050","term":"クロージング","definition":"商談を最終的な契約や受注に結びつけること。","example":"条件を確認したらクロージングに進みます。","category":"営業・取引"},{"id":"biz-051","term":"ネゴシエーション","definition":"条件や価格などについて相手と交渉すること。","example":"掲載単価についてネゴシエーションします。","category":"営業・取引"},{"id":"biz-052","term":"マージン","definition":"取引金額に含まれる手数料や利益の幅。","example":"媒体報酬を決める前にマージンを確認します。","category":"営業・取引"},{"id":"biz-053","term":"グロス","definition":"手数料や費用を差し引く前の総額。","example":"グロスの金額で広告主への請求額を整理します。","category":"営業・取引"},{"id":"biz-054","term":"ネット","definition":"取引上、手数料などを差し引いた後の金額。","example":"媒体への支払条件をネットの金額で確認します。","category":"営業・取引"},{"id":"biz-055","term":"アップセル","definition":"顧客に今より高額・上位の商品を提案すること。","example":"追加機能のあるプランへアップセルを提案します。","category":"営業・取引"},{"id":"biz-056","term":"クロスセル","definition":"顧客に関連する別の商品やサービスも提案すること。","example":"運用支援に加えて制作支援のクロスセルを検討します。","category":"営業・取引"},{"id":"biz-057","term":"リテンション","definition":"既存顧客との取引やサービス利用を維持すること。","example":"リテンション向上のために定期面談を続けます。","category":"営業・取引"},{"id":"biz-058","term":"チャーン","definition":"顧客が契約やサービス利用をやめること。","example":"サービスのチャーンを減らす施策を考えます。","category":"営業・取引"},{"id":"biz-059","term":"パイプライン","definition":"営業案件を見込みから受注まで段階別に管理したもの。","example":"今月のパイプラインを確認して売上見込みを出します。","category":"営業・取引"},{"id":"biz-060","term":"タッチポイント","definition":"顧客と会社・サービスが接する機会や接点。","example":"初回問い合わせのタッチポイントを改善します。","category":"営業・取引"},{"id":"biz-061","term":"KPI","definition":"目標達成に向けた途中経過を測る重要指標。","example":"新規媒体への提案件数をKPIとして追います。","category":"数字・経営"},{"id":"biz-062","term":"KGI","definition":"事業や活動で最終的に達成したい目標を示す指標。","example":"今期の売上目標をKGIとして設定します。","category":"数字・経営"},{"id":"biz-063","term":"OKR","definition":"挑戦的な目標と達成を測る主要な結果を組み合わせた管理方法。","example":"OKRを使ってチームの重点目標をそろえます。","category":"数字・経営"},{"id":"biz-064","term":"ROI","definition":"投資額に対してどれだけ利益が得られたかを示す指標。","example":"新ツール導入のROIを試算します。","category":"数字・経営"},{"id":"biz-065","term":"キャッシュフロー","definition":"一定期間の現金の入りと出の動き。","example":"入金と支払いの時期からキャッシュフローを確認します。","category":"数字・経営"},{"id":"biz-066","term":"P/L","definition":"損益計算書。一定期間の売上・費用・利益を示す書類。","example":"月次のP/Lで利益が出ているか確認します。","category":"数字・経営"},{"id":"biz-067","term":"B/S","definition":"貸借対照表。ある時点の資産・負債・純資産を示す書類。","example":"決算のB/Sを見て財務状況を確認します。","category":"数字・経営"},{"id":"biz-068","term":"グロスプロフィット","definition":"売上高から売上原価を差し引いた利益。売上総利益。","example":"グロスプロフィットの推移を月ごとに比較します。","category":"数字・経営"},{"id":"biz-069","term":"コスト","definition":"事業や業務を行うために必要な費用。","example":"広告素材の制作コストを見直します。","category":"数字・経営"},{"id":"biz-070","term":"イニシャルコスト","definition":"導入や立ち上げの最初にかかる費用。","example":"システム導入のイニシャルコストを見積もります。","category":"数字・経営"},{"id":"biz-071","term":"ランニングコスト","definition":"運用や利用を続けるために継続的にかかる費用。","example":"月額のランニングコストも予算に含めます。","category":"数字・経営"},{"id":"biz-072","term":"ブレークイーブン","definition":"収益と費用が等しくなり損益がゼロになる点。","example":"新サービスのブレークイーブンを計算します。","category":"数字・経営"},{"id":"biz-073","term":"バジェット","definition":"業務や事業に割り当てられた予算。","example":"この施策に使えるバジェットを確認します。","category":"数字・経営"},{"id":"biz-074","term":"フォーキャスト","definition":"今後の売上や業績についての予測値。","example":"来月のフォーキャストを更新します。","category":"数字・経営"},{"id":"biz-075","term":"アクチュアル","definition":"予測ではなく実際に発生した実績値。","example":"フォーキャストとアクチュアルを比較します。","category":"数字・経営"},{"id":"biz-076","term":"バリアンス","definition":"予算と実績など二つの数値の差異。","example":"売上のバリアンスが大きい原因を調べます。","category":"数字・経営"},{"id":"biz-077","term":"ランウェイ","definition":"手元の現金で事業を続けられる見込み期間。","example":"固定費を考慮して事業のランウェイを計算します。","category":"数字・経営"},{"id":"biz-078","term":"バーンレート","definition":"一定期間に事業で現金を消費する速さ・金額。","example":"毎月のバーンレートを抑える施策を検討します。","category":"数字・経営"},{"id":"biz-079","term":"ユニットエコノミクス","definition":"顧客一人や取引一件あたりの収益性を評価する考え方。","example":"一顧客あたりのユニットエコノミクスを確認します。","category":"数字・経営"},{"id":"biz-080","term":"LTV","definition":"一人の顧客が取引期間全体を通じてもたらす価値。","example":"契約継続率を改善してLTVを高めます。","category":"数字・経営"},{"id":"biz-081","term":"PDCA","definition":"計画・実行・評価・改善を繰り返す仕事の進め方。","example":"PDCAを回して提案資料を改善します。","category":"企画・戦略"},{"id":"biz-082","term":"OODA","definition":"観察・状況判断・意思決定・行動の流れで判断する考え方。","example":"変化が速い案件ではOODAで素早く動きます。","category":"企画・戦略"},{"id":"biz-083","term":"SWOT分析","definition":"強み・弱み・機会・脅威から状況を整理する分析。","example":"競合との違いをSWOT分析で整理します。","category":"企画・戦略"},{"id":"biz-084","term":"3C分析","definition":"顧客・競合・自社の三つの視点で状況を考える分析。","example":"3C分析をして営業戦略を考えます。","category":"企画・戦略"},{"id":"biz-085","term":"STP","definition":"市場の細分化・対象顧客の選定・自社の立ち位置を決める考え方。","example":"新サービスのSTPを整理します。","category":"企画・戦略"},{"id":"biz-086","term":"ペルソナ","definition":"代表的な顧客像を具体的な人物像として設定したもの。","example":"想定する担当者のペルソナを作ります。","category":"企画・戦略"},{"id":"biz-087","term":"カスタマージャーニー","definition":"顧客が認知から購入・利用に至るまでの体験の流れ。","example":"カスタマージャーニーをもとに案内内容を考えます。","category":"企画・戦略"},{"id":"biz-088","term":"ベンチマーク","definition":"比較や目標設定の基準となる数値・企業・事例。","example":"同規模の会社をベンチマークにして目標を立てます。","category":"企画・戦略"},{"id":"biz-089","term":"ポジショニング","definition":"市場や顧客の中で自社をどう位置付けるかを決めること。","example":"競合と差別化できるポジショニングを考えます。","category":"企画・戦略"},{"id":"biz-090","term":"バリュープロポジション","definition":"顧客に提供する独自の価値を表すもの。","example":"サービスのバリュープロポジションを整理します。","category":"企画・戦略"},{"id":"biz-091","term":"アウトプット","definition":"作業の結果として作った資料や成果物など。","example":"会議のアウトプットとして提案書を完成させます。","category":"企画・戦略"},{"id":"biz-092","term":"アウトカム","definition":"活動によって実際に生まれた変化や効果。","example":"資料を配るだけでなく受注というアウトカムを確認します。","category":"企画・戦略"},{"id":"biz-093","term":"イシュー","definition":"解決・判断すべき重要な論点や問題。","example":"今週のイシューは媒体の掲載率を上げることです。","category":"企画・戦略"},{"id":"biz-094","term":"インサイト","definition":"データや観察から得られる表面には見えにくい重要な気づき。","example":"利用者の行動データから新しいインサイトを探します。","category":"企画・戦略"},{"id":"biz-095","term":"アサンプション","definition":"計画や試算の前提として置く仮定。","example":"売上予測のアサンプションを明確にします。","category":"企画・戦略"},{"id":"biz-096","term":"プロトタイプ","definition":"本格開発前に試す試作品や初期モデル。","example":"画面のプロトタイプを作って使いやすさを確認します。","category":"企画・戦略"},{"id":"biz-097","term":"PoC","definition":"アイデアや技術が実現できるか小規模に検証すること。","example":"新機能を導入する前にPoCを実施します。","category":"企画・戦略"},{"id":"biz-098","term":"MVP","definition":"必要最小限の機能だけを持ち利用者に試してもらう製品。","example":"まずMVPを公開して利用者の反応を集めます。","category":"企画・戦略"},{"id":"biz-099","term":"ピボット","definition":"状況を踏まえて事業・製品の方向性を大きく変えること。","example":"需要が少なければピボットを検討します。","category":"企画・戦略"},{"id":"biz-100","term":"スケール","definition":"事業や仕組みをより大きな規模へ拡大すること。","example":"運用手順を整えてからサービスをスケールさせます。","category":"企画・戦略"}];
const CATEGORY_OPTIONS=["会議・連絡","業務進行","営業・取引","数字・経営","企画・戦略"];

const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const mix=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const find=id=>words.find(x=>x.id===id);
let words=[],key='',tab='study',order=[],idx=0,front=false,startSide='back',search='',selected='',editing=null,quiz={phase:'setup',n:10,ids:[],index:0,choices:[],chosen:null,answers:[]};

const STICKER_DEFAULTS={names:['赤','青','黄','緑'],colors:['#da7080','#5783cf','#d9b044','#49a68a']};
let stickerConfig={names:[...STICKER_DEFAULTS.names],colors:[...STICKER_DEFAULTS.colors]};
let stickerKey='',studyRange='all',quizRange='all',quizDirection='definition',manageRange='all',showStickerSettings=false;
function validStickers(c){if(!c||!Array.isArray(c.names)||!Array.isArray(c.colors)||c.names.length!==4||c.colors.length!==4)return null;const names=c.names.map(x=>String(x||'').trim().slice(0,20)),colors=c.colors.map(x=>String(x||'').trim().toLowerCase());return names.every(Boolean)&&colors.every(x=>/^#[0-9a-f]{6}$/.test(x))?{names,colors}:null}
function tagOptions(range){return [['all','すべての単語'],['untagged','付箋なし'],...stickerConfig.names.map((x,i)=>['tag-'+i,x])].map(([v,t])=>'<option value="'+v+'" '+(v===range?'selected':'')+'>'+esc(t)+'</option>').join('')}
function tagPool(range){if(range==='untagged')return words.filter(c=>!(c.tags||[]).length);const m=/^tag-([0-3])$/.exec(range);return m?words.filter(c=>(c.tags||[]).includes(Number(m[1]))):words}
function stickerButtons(id,expanded=false){const c=find(id);if(!c)return '';return '<div class="biz-stickers '+(expanded?'expanded':'compact')+'" role="group" aria-label="番外編の付箋">'+stickerConfig.colors.map((color,i)=>{const chosen=(c.tags||[]).includes(i),name=stickerConfig.names[i];return '<button class="biz-sticker '+(chosen?'selected':'')+'" type="button" data-do="toggleTag" data-id="'+esc(id)+'" data-tag="'+i+'" title="'+esc(name)+'" aria-pressed="'+chosen+'" aria-label="'+esc(name)+'の付箋を'+(chosen?'外す':'付ける')+'"><span class="biz-sticker-dot" style="background:'+color+'"></span>'+(chosen?'<span class="biz-sticker-check" aria-hidden="true">✓</span>':'')+(expanded?'<span class="biz-sticker-name">'+esc(name)+'</span>':'')+'</button>'}).join('')+'</div>'}
function tagBadges(c){return '<span class="biz-tag-badges">'+(c.tags||[]).map(i=>'<span class="biz-badge-dot" style="background:'+stickerConfig.colors[i]+'" title="'+esc(stickerConfig.names[i])+'"></span>').join('')+'</span>'}
function toggleTag(id,i){const c=find(id);if(!c||!Number.isInteger(i)||i<0||i>3)return;const tags=new Set(c.tags||[]);if(tags.has(i))tags.delete(i);else tags.add(i);if(store(words.map(x=>x.id===id?{...x,tags:[...tags].sort((a,b)=>a-b)}:x),false))render()}
function saveStickerConfig(c){const cfg=validStickers(c);if(!cfg){alertUser('付箋の名前・色を確認してください');return false}try{localStorage.setItem(stickerKey,JSON.stringify(cfg));stickerConfig=cfg;return true}catch(e){alertUser('付箋設定を保存できませんでした');return false}}
function stickerSettingsPanel(){if(!showStickerSettings)return '';return '<form id="stickerForm" class="biz-sticker-settings"><h3>番外編の付箋設定</h3><p class="muted">広告用語の付箋とは完全に独立しています。</p>'+stickerConfig.names.map((n,i)=>'<div class="sticker-setting-row"><label for="stickerName'+i+'">付箋 '+(i+1)+'</label><input id="stickerColor'+i+'" type="color" value="'+stickerConfig.colors[i]+'" aria-label="付箋の色"><input id="stickerName'+i+'" type="text" maxlength="20" required value="'+esc(n)+'" aria-label="付箋の名前"></div>').join('')+'<div class="controls"><button type="submit" class="btn primary">付箋設定を保存</button><button type="button" class="btn" data-do="resetStickers">初期設定に戻す</button></div></form>'}
function applyStickerSettings(e){e.preventDefault();const cfg={names:STICKER_DEFAULTS.names.map((_,i)=>$('stickerName'+i).value),colors:STICKER_DEFAULTS.colors.map((_,i)=>$('stickerColor'+i).value)};if(saveStickerConfig(cfg)){render();alertUser('付箋設定を保存しました')}}

function alertUser(s){$('bizNotice').textContent=s;$('bizNotice').classList.add('show');setTimeout(()=>$('bizNotice').classList.remove('show'),2800)}
function clean(c){if(!c||typeof c!=='object')return null;const term=String(c.term||'').trim().slice(0,100),definition=String(c.definition||'').trim().slice(0,1500);if(!term||!definition)return null;const tags=Array.isArray(c.tags)?[...new Set(c.tags.filter(i=>Number.isInteger(i)&&i>=0&&i<4))].sort((a,b)=>a-b):[];return {id:String(c.id||'biz-new').slice(0,100),term,definition,example:String(c.example||'').slice(0,1200),category:String(c.category||CATEGORY_OPTIONS[0]).slice(0,60),tags}}
function start(){let profile='default';try{profile=JSON.parse(localStorage.getItem('adterms-lab-profiles-v3')||'null')?.selected||'default'}catch(e){}key='adterms-lab-business-v1-'+profile;stickerKey='adterms-lab-business-stickers-v1-'+profile;try{stickerConfig=validStickers(JSON.parse(localStorage.getItem(stickerKey)||'null'))||{names:[...STICKER_DEFAULTS.names],colors:[...STICKER_DEFAULTS.colors]}}catch(e){stickerConfig={names:[...STICKER_DEFAULTS.names],colors:[...STICKER_DEFAULTS.colors]}}try{const raw=localStorage.getItem(key);if(raw===null){words=DEFAULT_CARDS.map(clean);localStorage.setItem(key,JSON.stringify(words))}else{const arr=JSON.parse(raw);if(!Array.isArray(arr)||arr.length>1000||arr.some(c=>!clean(c)))throw Error('bad data');words=arr.map(clean)}}catch(e){words=DEFAULT_CARDS.map(clean);alertUser('保存データが読めなかったため初期データを表示しています。')}render()}
function store(next,resetOrder=true){if(next.length>1000||next.some(c=>!clean(c)))return alertUser('入力データを確認してください'),false;try{const cleaned=next.map(clean);localStorage.setItem(key,JSON.stringify(cleaned));words=cleaned;if(resetOrder)order=[];return true}catch(e){alertUser('保存できませんでした');return false}}
function mask(c){const all=[c.term,c.term.replace(/[（(].*$/,'').trim(),...Array.from(c.term.matchAll(/[（(]([^）)]+)[）)]/g),m=>m[1])].filter(Boolean);const reserved='\\.^$*+?()[]{}|';const safe=t=>[...t].map(ch=>reserved.includes(ch)?'\\'+ch:ch).join('');const rx=new RegExp([...new Set(all)].sort((a,b)=>b.length-a.length).map(safe).join('|'),'gi');let out='',pos=0;for(const m of c.example.matchAll(rx)){out+=esc(c.example.slice(pos,m.index))+'<span class="mask">？？？</span>';pos=m.index+m[0].length}return out+esc(c.example.slice(pos))}
function syncQuizViewport(){document.body.classList.toggle('biz-quiz-in-progress',tab==='quiz'&&quiz.phase==='play')}
function render(){syncQuizViewport();$('bizCount').textContent=words.length+'語';document.querySelectorAll('.tabs [data-tab]').forEach(b=>{const v=b.dataset.tab===tab;b.classList.toggle('active',v);b.setAttribute('aria-pressed',String(v))});if(tab==='study')study();else if(tab==='quiz')quizPage();else manage()}
function open(t){if(!['study','quiz','manage'].includes(t))return;tab=t;editing=null;render();scrollTo({top:0,behavior:'instant'})}
function study(){
 const pool=tagPool(studyRange),allowed=new Set(pool.map(c=>c.id));
 if(order.length!==pool.length||order.some(id=>!allowed.has(id))){order=mix(pool.map(c=>c.id));idx=0;front=startSide==='front'}
 const filter='<select class="range-select" id="studyTagRange" aria-label="学習範囲">'+tagOptions(studyRange)+'</select>';
 if(!order.length){$('bizView').innerHTML='<div class="study-head"><strong>0 / 0</strong>'+filter+'</div><div class="surface study-empty">対象の単語がありません。付箋の範囲を変えてください。</div>';return}
 const c=find(order[idx]),contents=front?'<div class="term-center">'+esc(c.term)+'</div>':'<div class="clue">意味</div><div class="meaning">'+esc(c.definition)+'</div>'+(c.example?'<div class="clue" style="margin-top:21px">実務での例文</div><div class="example">'+mask(c)+'</div>':'');
 $('bizView').innerHTML='<div class="study-head"><strong>'+(idx+1)+' / '+order.length+'</strong><div class="range-tools">'+filter+'<button class="btn ghost" data-do="shuffle">↻ シャッフル</button></div></div><div class="study-stage"><button class="arrow" data-do="prev" aria-label="前の単語へ" '+(idx===0?'disabled':'')+'>‹</button><article class="card '+(front?'front':'back')+'"><div class="card-header"><span class="pill">'+esc(c.category)+'</span>'+stickerButtons(c.id)+'</div><div class="flip-area" data-do="flip" role="button" tabindex="0" aria-label="カードをめくる" aria-keyshortcuts="Enter Space">'+contents+'</div><span class="hint">'+(front?'タップで意味を見る':'タップで単語を見る')+'</span></article><button class="arrow" data-do="next" aria-label="次の単語へ" '+(idx>=order.length-1?'disabled':'')+'>›</button></div><div class="study-bar"><span class="mode-label">開始面</span><div class="segment"><button data-do="side" data-value="back" class="'+(startSide==='back'?'active':'')+'">意味から</button><button data-do="side" data-value="front" class="'+(startSide==='front'?'active':'')+'">単語から</button></div></div>';
}
function move(n){if(idx+n<0||idx+n>=order.length)return;idx+=n;front=startSide==='front';study()}
function flip(){
 if(tab!=='study'||!order.length)return;
 front=!front;
 study();
}
function makeQuizDirections(count,direction){
 if(direction!=='mixed')return Array(count).fill(direction==='term'?'term':'definition');
 return mix(Array.from({length:count},(_,i)=>i%2===0?'definition':'term'));
}
function beginQuiz(){
 if(words.length<4)return alertUser('クイズには4語以上必要です');
 const pool=tagPool(quizRange);
 if(!pool.length)return alertUser('対象の単語がありません');
 const n=Math.min(Number($('quizCount').value)||pool.length,pool.length);
 quizDirection=['definition','term','mixed'].includes($('quizDirection').value)?$('quizDirection').value:'definition';
 quiz={phase:'play',n,ids:mix(pool.map(c=>c.id)).slice(0,n),index:0,choices:[],chosen:null,answers:[],direction:quizDirection,directions:makeQuizDirections(n,quizDirection),currentDirection:'definition'};
 choices();
 quizPage();
}
function choices(){
 const answer=find(quiz.ids[quiz.index]);
 if(!answer){quiz.phase='done';return}
 quiz.currentDirection=quiz.directions?.[quiz.index]||'definition';
 const field=quiz.currentDirection==='term'?'definition':'term';
 const seen=new Set([String(answer[field]||'').trim()]);
 const candidates=[
  ...mix(words.filter(w=>w.id!==answer.id&&w.category===answer.category)),
  ...mix(words.filter(w=>w.id!==answer.id&&w.category!==answer.category))
 ];
 const distractors=[];
 for(const w of candidates){
  const label=String(w[field]||'').trim();
  if(label&&!seen.has(label)){seen.add(label);distractors.push(w)}
  if(distractors.length===3)break;
 }
 if(distractors.length<3){alertUser('選択肢が不足しています');quiz.phase='done';return}
 quiz.choices=mix([answer,...distractors]);
 quiz.chosen=null;
}
function quizPage(){
 syncQuizViewport();
 if(quiz.phase==='setup'){
  const total=tagPool(quizRange).length;
  const counts=[10,20,50,100].filter(n=>n<=total);
  const formatOptions=[
   ['definition','説明から用語を選ぶ'],
   ['term','用語から説明を選ぶ'],
   ['mixed','両方を混ぜる']
  ];
  $('bizView').innerHTML='<div class="surface" style="max-width:600px;margin:auto"><h2>4択クイズ</h2><p class="muted">問題形式を選んで理解を確かめよう。最後にまとめて復習できます。</p><div class="field"><label for="quizTagRange">付箋の出題範囲</label><select id="quizTagRange">'+tagOptions(quizRange)+'</select></div><div class="field"><label for="quizCount">問題数（対象 '+total+'語）</label><select id="quizCount">'+counts.map(n=>'<option value="'+n+'">'+n+'問</option>').join('')+(total&&!counts.includes(total)?'<option value="'+total+'">全件 ('+total+')</option>':'')+'</select></div><div class="field"><label for="quizDirection">問題形式</label><select id="quizDirection">'+formatOptions.map(([value,label])=>'<option value="'+value+'"'+(quizDirection===value?' selected':'')+'>'+label+'</option>').join('')+'</select></div><button class="btn primary" style="width:100%" data-do="quizStart" '+(!total?'disabled':'')+'>クイズを始める</button></div>';
  return;
 }
 if(quiz.phase==='done')return result();
 const c=find(quiz.ids[quiz.index]),answered=quiz.chosen!==null;
 if(!c){quiz.phase='done';return result()}
 const reverse=quiz.currentDirection==='term';
 const clue=reverse?'この用語に当てはまる説明は？':'この説明に当てはまる用語は？';
 const prompt=reverse?c.term:c.definition;
 $('bizView').innerHTML='<div class="surface quiz-play"><div class="study-head"><strong>'+(quiz.index+1)+' / '+quiz.ids.length+' 問</strong><button class="btn ghost" data-do="quizFinish">終了</button></div><div class="question '+(reverse?'term-question':'')+'"><div class="clue">'+clue+'</div><h2>'+esc(prompt)+'</h2></div><div class="options '+(reverse?'definition-options':'')+'">'+quiz.choices.map((o,i)=>{const good=answered&&o.id===c.id,bad=answered&&o.id===quiz.chosen&&o.id!==c.id;return '<button class="option '+(good?'right':bad?'wrong':'')+'" data-do="answer" data-id="'+esc(o.id)+'" '+(answered?'disabled':'')+'><span class="letter">'+('ABCD'[i])+'</span><span class="option-text">'+esc(reverse?o.definition:o.term)+'</span>'+(good||bad?'<span class="symbol">'+(good?'○':'×')+'</span>':'')+'</button>'}).join('')+'</div><div class="quiz-actions"><button class="btn '+(answered?'primary':'')+'" data-do="'+(answered?'advance':'skip')+'">'+(answered?(quiz.index===quiz.ids.length-1?'結果を見る':'次へ →'):'スキップ →')+'</button></div></div>';
}
function answer(id){
 if(quiz.phase!=='play'||quiz.chosen!==null||!quiz.choices.some(c=>c.id===id))return;
 quiz.chosen=id;
 quiz.answers.push({id:quiz.ids[quiz.index],selected:id,status:id===quiz.ids[quiz.index]?'correct':'incorrect',direction:quiz.currentDirection});
 quizPage();
}
function next(skipped){
 if(quiz.phase!=='play')return;
 if(skipped&&quiz.chosen===null)quiz.answers.push({id:quiz.ids[quiz.index],selected:null,status:'skipped',direction:quiz.currentDirection});
 else if(quiz.chosen===null)return;
 quiz.index++;
 if(quiz.index>=quiz.ids.length)quiz.phase='done';
 else choices();
 quizPage();
 scrollTo({top:0,behavior:'instant'});
}
function finish(){
 if(quiz.phase!=='play')return;
 if(quiz.chosen===null)quiz.answers.push({id:quiz.ids[quiz.index],selected:null,status:'skipped',direction:quiz.currentDirection});
 quiz.phase='done';
 quizPage();
}
function result(){
 const a=quiz.answers,good=a.filter(x=>x.status==='correct').length,bad=a.filter(x=>x.status==='incorrect').length,skip=a.filter(x=>x.status==='skipped').length;
 $('bizView').innerHTML='<div class="surface"><h2>クイズ結果</h2><div class="quiz-scores"><div class="score good"><strong>'+good+'</strong>正解</div><div class="score bad"><strong>'+bad+'</strong>不正解</div><div class="score skip"><strong>'+skip+'</strong>スキップ</div></div><div class="controls"><button class="btn primary" data-do="quizReset">もう一度</button><button class="btn" data-tab="study">単語帳へ</button></div><div class="review-list">'+a.map((x,i)=>{const c=find(x.id),picked=find(x.selected);if(!c)return '';const cl=x.status==='correct'?'good':x.status==='incorrect'?'bad':'skip',status=x.status==='correct'?'○ 正解':x.status==='incorrect'?'× 不正解':'– スキップ';const wrongLabel=x.direction==='term'?'選択した説明：':'選択した用語：';const wrongText=x.direction==='term'?picked?.definition:picked?.term;return '<div class="review-row '+cl+'"><span class="status">'+status+'</span><strong>'+(i+1)+'. '+esc(c.term)+'</strong><p>'+esc(c.definition)+'</p>'+(x.status==='incorrect'&&picked?'<p>'+wrongLabel+esc(wrongText)+'</p>':'')+'<div class="quiz-recap-tags">'+stickerButtons(c.id)+'</div></div>'}).join('')+'</div></div>';
}
function manage(){
 if(editing!==null)return editor();
 $('bizView').innerHTML='<div class="surface"><div class="manage-top"><h2>単語管理</h2><button class="btn primary" data-do="add">＋ 追加</button></div><div class="manage-tools"><input type="search" id="searchTerms" placeholder="単語・意味・例文を検索" value="'+esc(search)+'"><select id="manageTagRange" class="range-select" aria-label="付箋の絞り込み">'+tagOptions(manageRange)+'</select><button class="btn" data-do="stickerSettings">付箋設定 ⚙</button><button class="btn" data-do="export">バックアップ</button><button class="btn" data-do="import">読み込み</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>'+stickerSettingsPanel()+'<div id="preview"></div><p class="muted" id="termCount"></p><div class="manage-list" id="termsList"></div><div class="controls" style="margin-top:16px"><button class="btn ghost" data-do="restore">初期100語の不足分を復元</button></div></div>';
 list();preview();
}
function list(){
 const target=$('termsList');if(!target)return;
 const q=search.toLocaleLowerCase('ja'),shown=tagPool(manageRange).filter(c=>!q||[c.term,c.definition,c.example,c.category].some(v=>v.toLocaleLowerCase('ja').includes(q)));
 $('termCount').textContent=shown.length+'件 / 全'+words.length+'語';
 target.innerHTML=shown.map(c=>'<div class="manage-row"><button class="manage-term" data-do="inspect" data-id="'+esc(c.id)+'"><strong>'+esc(c.term)+'</strong><small>'+esc(c.category)+' · '+esc(c.definition.slice(0,70))+'</small>'+tagBadges(c)+'</button><div class="actions"><button class="icon-btn" data-do="edit" data-id="'+esc(c.id)+'" aria-label="編集">✎</button><button class="icon-btn danger" data-do="delete" data-id="'+esc(c.id)+'" aria-label="削除">×</button></div></div>').join('')||'<p class="muted">該当する単語がありません。</p>';
}
function preview(){
 const target=$('preview'),c=find(selected);if(!target)return;
 target.innerHTML=c?'<div class="manage-preview"><div class="controls" style="justify-content:space-between"><span class="pill">'+esc(c.category)+'</span><button class="btn ghost" data-do="closePreview">閉じる ×</button></div><h3>'+esc(c.term)+'</h3><p>'+esc(c.definition)+'</p>'+(c.example?'<div class="clue">実務での例文</div><p>'+esc(c.example)+'</p>':'')+'<div class="clue">付箋</div>'+stickerButtons(c.id,true)+'<button class="btn" data-do="edit" data-id="'+esc(c.id)+'">編集する</button></div>':'';
}
function editor(){const c=find(editing),fresh=editing==='new';if(!fresh&&!c){editing=null;return manage()}$('bizView').innerHTML='<div class="surface"><div class="manage-top"><h2>'+(fresh?'単語を追加':'単語を編集')+'</h2><button class="btn ghost" data-do="cancel">← 一覧へ</button></div><form id="editForm"><div class="field"><label>単語名 *</label><input id="editTerm" required maxlength="100" value="'+esc(c?.term||'')+'"></div><div class="field"><label>意味 *</label><textarea id="editDefinition" required maxlength="1500">'+esc(c?.definition||'')+'</textarea></div><div class="field"><label>実務での例文</label><textarea id="editExample" maxlength="1200">'+esc(c?.example||'')+'</textarea></div><div class="field"><label>カテゴリ</label><select id="editCategory">'+CATEGORY_OPTIONS.map(v=>'<option value="'+esc(v)+'" '+(v===(c?.category||CATEGORY_OPTIONS[0])?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div><div class="controls"><button class="btn primary" type="submit">保存する</button><button class="btn" data-do="cancel">キャンセル</button></div></form></div>'}
function saveEdit(e){e.preventDefault();const term=$('editTerm').value.trim(),definition=$('editDefinition').value.trim(),example=$('editExample').value.trim(),category=$('editCategory').value;if(!term||!definition)return alertUser('単語名・意味を入力してください');if(words.some(c=>c.id!==editing&&c.term===term))return alertUser('同名の単語があります');const c=find(editing),id=c?.id||'biz-user-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),item={id,term,definition,example,category,tags:[...(c?.tags||[])]};if(store(c?words.map(x=>x.id===id?item:x):[...words,item])){editing=null;selected=id;manage();alertUser('保存しました')}}
function exportData(){const blob=new Blob([JSON.stringify({app:'AdTerms Lab ビジネス横文字100',version:2,cards:words,stickers:stickerConfig},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ビジネス横文字100_バックアップ.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3500)}
async function importData(file){if(!file||file.size>2e6)return alertUser('2MB以下のJSONを選んでください');try{const d=JSON.parse(await file.text());if(d.app!=='AdTerms Lab ビジネス横文字100'||!Array.isArray(d.cards)||d.cards.some(c=>!clean(c)))throw Error('bad');const w=d.cards.map(clean);if(new Set(w.map(c=>c.id)).size!==w.length||new Set(w.map(c=>c.term)).size!==w.length)throw Error('duplicate');const cfg=d.stickers===undefined?null:validStickers(d.stickers);if(d.stickers!==undefined&&!cfg)throw Error('invalid settings');if(confirm(w.length+'語で番外編の単語を置き換えますか？')&&store(w)){if(cfg)saveStickerConfig(cfg);selected='';quiz.phase='setup';render();alertUser('読み込みました')}}catch(e){alertUser('バックアップが読み込めませんでした')}}
document.getElementById('brandHome').addEventListener('click',()=>{window.location.assign('./index.html')});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){open(t.dataset.tab);return}const b=e.target.closest('[data-do]');if(!b)return;const a=b.dataset.do,id=b.dataset.id;if(a==='toggleTag'){toggleTag(id,Number(b.dataset.tag));return}if(a==='prev')move(-1);else if(a==='next')move(1);else if(a==='flip'){flip()}else if(a==='shuffle'){order=mix(tagPool(studyRange).map(c=>c.id));idx=0;front=startSide==='front';study()}else if(a==='side'){startSide=b.dataset.value;front=startSide==='front';study()}else if(a==='quizStart')beginQuiz();else if(a==='answer')answer(id);else if(a==='advance')next(false);else if(a==='skip')next(true);else if(a==='quizFinish')finish();else if(a==='quizReset'){quiz.phase='setup';quizPage()}else if(a==='inspect'){selected=id;preview()}else if(a==='closePreview'){selected='';preview()}else if(a==='add'){editing='new';editor()}else if(a==='edit'){editing=id;editor()}else if(a==='cancel'){editing=null;manage()}else if(a==='stickerSettings'){showStickerSettings=!showStickerSettings;manage()}else if(a==='resetStickers'){if(confirm('付箋名と色を初期状態に戻しますか？単語への付箋は残ります。')&&saveStickerConfig(STICKER_DEFAULTS)){manage();alertUser('付箋設定を戻しました')}}else if(a==='delete'){const c=find(id);if(c&&confirm('「'+c.term+'」を削除しますか？')&&store(words.filter(x=>x.id!==id))){if(selected===id)selected='';manage();alertUser('削除しました')}}else if(a==='restore'){const old=new Set(words.map(c=>c.term)),missing=DEFAULT_CARDS.filter(c=>!old.has(c.term));if(!missing.length)return alertUser('初期100語はすべて登録済みです');if(confirm(missing.length+'語を追加しますか？')&&store([...words,...missing])){manage();alertUser('復元しました')}}else if(a==='export')exportData();else if(a==='import')$('importFile')?.click()});
document.addEventListener('submit',e=>{if(e.target.id==='editForm')saveEdit(e);else if(e.target.id==='stickerForm')applyStickerSettings(e)});
document.addEventListener('input',e=>{if(e.target.id==='searchTerms'){search=e.target.value;list()}});
document.addEventListener('change',async e=>{if(e.target.id==='studyTagRange'){studyRange=e.target.value;order=[];study()}else if(e.target.id==='quizTagRange'){quizRange=e.target.value;quizPage()}else if(e.target.id==='quizDirection'){quizDirection=e.target.value}else if(e.target.id==='manageTagRange'){manageRange=e.target.value;list()}else if(e.target.id==='importFile'){const file=e.target.files?.[0];e.target.value='';if(file)await importData(file)}});
document.addEventListener('keydown',e=>{
 if(tab!=='study'||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.isComposing||
   e.target.closest('input,textarea,select,[contenteditable]'))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
  e.preventDefault();
  move(e.key==='ArrowLeft'?-1:1);
  return;
 }
 // Enter and Space flip the card, including when the card itself has focus.
 // Preserve normal keyboard activation of buttons, links and other controls.
 if((e.key==='Enter'||e.key===' '||e.code==='Space')&&
   !e.target.closest('button,a,summary,[role="combobox"]')){
  e.preventDefault();
  if(!e.repeat)flip();
 }
});
start();
</script>
