<style>
:root{--ink:#243249;--muted:#718093;--line:#e5eaf0;--soft:#f5f7fb;--navy:#344a72;--accent:#546cb0;--pale:#eef2fa}
*{box-sizing:border-box}body{margin:0;background:#fafbfd;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #99add6;outline-offset:2px}a{color:var(--navy);text-decoration:none}a:hover{text-decoration:underline}[hidden]{display:none!important}
.top{background:#fff;border-bottom:1px solid var(--line)}.top-inner{max-width:1000px;margin:auto;min-height:58px;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.return{font-size:12px;font-weight:700;color:#6e7a8e;white-space:nowrap}.brand{font-size:13px;font-weight:850;color:#44516a;white-space:nowrap}
.shell{max-width:980px;margin:24px auto 60px;padding:0 24px}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 18px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:850;color:#7f92ad;margin:0 0 5px}h1{font-size:clamp(23px,4vw,31px);line-height:1.3;letter-spacing:-.045em;margin:0}.intro-desc{font-size:13px;color:var(--muted);margin:7px 0 0}.count{font-size:12px;font-weight:750;color:var(--navy);background:#eef2f8;border:1px solid #e1e7f1;border-radius:99px;padding:7px 12px;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;background:#eff2f6;border-radius:14px;margin-bottom:19px}.tabs button{border:0;border-radius:10px;background:transparent;color:#7b8699;padding:12px 10px;font-weight:750;font-size:14px}.tabs button.active{background:white;color:var(--navy);box-shadow:0 2px 8px #34486612}
.surface{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 34px rgba(35,50,80,.045)}h2{font-size:18px;line-height:1.45;letter-spacing:-.025em;margin:0 0 8px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:8px;background:#f0f3f7;color:#778499;font-size:10px;font-weight:750}
.btn{min-height:40px;padding:9px 15px;display:inline-flex;justify-content:center;align-items:center;border:1px solid #dfe5ec;background:#fff;border-radius:10px;color:#45556e;font-size:13px;font-weight:750}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn:hover:not(:disabled){filter:brightness(.975)}.btn.ghost{border-color:transparent;background:transparent;color:#667892}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.study-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.study-head strong{font-size:13px;color:#758196}.study-stage{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:9px;align-items:center}.arrow{border:0;background:transparent;color:#7384a0;height:72px;font-size:42px;font-family:Arial,sans-serif;border-radius:12px;line-height:1}.arrow:hover:not(:disabled){background:#edf1f7}
.card{height:clamp(270px,calc(100dvh - 335px),540px);border:1px solid #e3e9f2;background:white;box-shadow:0 8px 28px rgba(39,55,80,.045);border-radius:17px;display:flex;flex-direction:column;overflow:hidden;position:relative}.card-header{padding:15px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.card-header small{color:#8794a7;font-size:11px}.flip-area{flex:1;position:relative;min-height:0;padding:14px 24px 53px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;outline-offset:-4px;cursor:pointer}.card.front .flip-area{overflow:hidden}.term-center{position:absolute;top:50%;left:14px;right:14px;transform:translateY(-50%);text-align:center;font-size:clamp(23px,5vw,35px);font-weight:850;line-height:1.45;overflow-wrap:anywhere}.clue{display:block;font-size:11px;font-weight:800;color:#7f8da0;letter-spacing:.03em;margin:7px 0}.meaning{font-size:17px;color:#26364e;font-weight:570;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.example{background:#f4f6f9;border-left:3px solid #d5dfea;padding:12px 14px;border-radius:0 9px 9px 0;font-size:14px;color:#46546a;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.mask{display:inline-block;background:#e1e9f4;border:1px solid #d5dfed;border-radius:5px;padding:0 6px;color:#344b69;font-weight:750;white-space:nowrap}.hint{position:absolute;bottom:15px;left:9px;right:9px;text-align:center;font-size:11px;color:#a0a9b8;pointer-events:none}.study-bar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}.segment{display:flex;gap:2px;background:#edf0f5;border:1px solid #e5eaf1;border-radius:10px;padding:3px}.segment button{border:1px solid transparent;background:transparent;color:#7b8797;padding:6px 13px;border-radius:8px;min-height:34px;font-size:12px;font-weight:750}.segment button.active{background:white;border-color:#dfe5ec;color:var(--navy);box-shadow:0 2px 4px #1c2a4410}.mode-label{font-size:11px;color:#8491a1;font-weight:750}.study-empty{text-align:center;padding:40px 10px}
.quiz-play .progress{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#7d8899;font-weight:750;margin-bottom:12px}.question{background:#f6f8fc;border:1px solid #e7ebf3;border-radius:14px;padding:19px;margin:0 0 14px}.question .clue{margin:0 0 8px}.question h2{font-size:clamp(17px,2.7vw,21px);line-height:1.75;margin:0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{min-width:0;min-height:75px;border:1px solid #dfe5ed;background:white;border-radius:12px;display:flex;align-items:center;gap:10px;text-align:left;padding:12px;font-size:13px;line-height:1.65;color:#354259}.option:not(:disabled):hover{border-color:#9caece;background:#f8faff}.option:disabled{cursor:default;opacity:1}.option .letter{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:7px;background:#f0f3f7;color:#7f8a9d;font-size:11px;font-weight:850}.option .option-text{flex:1;min-width:0;overflow-wrap:anywhere}.option .symbol{font-size:27px;font-weight:900;line-height:1;flex:none;margin-left:auto}.option.right{background:#ebf8f1;border-color:#75bd97}.option.right .symbol{color:#188454}.option.wrong{background:#fff2f4;border-color:#de9eaa}.option.wrong .symbol{color:#c34e60}.quiz-actions{display:flex;justify-content:flex-end;margin-top:16px}.quiz-actions .btn{min-width:150px}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 15px}.field label{color:#56657a;font-weight:800;font-size:12px}.field input,.field select,.field textarea{border:1px solid #dbe2ec;border-radius:10px;padding:10px 12px;background:white;color:#2d3e55;width:100%;font-size:14px;min-height:43px}.field textarea{resize:vertical;min-height:94px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quiz-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.score{border-radius:12px;padding:13px;text-align:center;font-size:12px;font-weight:750}.score strong{display:block;font-size:26px;line-height:1.25}.score.good{background:#eaf8ef;color:#236744}.score.bad{background:#fff0f1;color:#a94051}.score.skip{background:#f0f4fa;color:#506c91}.review-list{display:grid;gap:9px;margin-top:18px}.review-row{border:1px solid #e4e9f2;border-radius:12px;padding:13px 15px;background:#fff}.review-row.good{border-left:4px solid #56a47f}.review-row.bad{border-left:4px solid #db687a}.review-row.skip{border-left:4px solid #8e9fb7}.review-row p{margin:5px 0;font-size:13px;color:#526176}.review-row strong{font-size:14px}.review-row .status{font-size:11px;float:right;font-weight:800}
.manage-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.manage-top h2{margin:0}.manage-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px}.manage-tools input{border:1px solid #dfe5ed;border-radius:10px;min-width:200px;min-height:41px;padding:9px 12px;font-size:14px;flex:1;background:#fff;color:var(--ink)}.manage-list{border-top:1px solid #edf0f4;margin-top:12px}.manage-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f4;padding:13px 0;gap:12px}.manage-term{border:0;background:transparent;text-align:left;min-width:0;flex:1;color:#27354a;padding:0}.manage-term strong{display:block;font-size:14px}.manage-term small{display:block;color:#8793a4;font-size:11px;line-height:1.6;margin-top:2px;overflow-wrap:anywhere}.manage-row .actions{display:flex;gap:5px}.icon-btn{border:1px solid #e2e7ee;background:#fff;color:#65758c;border-radius:9px;width:37px;height:37px;flex:none;font-size:17px}.manage-preview{border:1px solid #dce5f0;background:#f8faff;padding:16px;border-radius:12px;margin:10px 0 16px}.manage-preview h3{margin:0 0 5px;font-size:18px}.manage-preview p{white-space:pre-wrap;margin:8px 0;font-size:13px;color:#536279}.danger{border-color:#e8bdc4!important;color:#b24452!important}.message{display:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#273a57;color:white;padding:11px 18px;z-index:99;border-radius:10px;font-size:12px;box-shadow:0 10px 28px #1d2c4225;max-width:92vw}.message.show{display:block}.footer{font-size:11px;color:#8792a2;text-align:center;margin:20px 0}
@media(max-width:680px){.top-inner{min-height:56px;padding:10px 15px}.shell{margin:16px auto 30px;padding:0 13px}.intro{margin-bottom:15px;align-items:flex-start}.intro-desc{font-size:11px}.count{padding:5px 9px;font-size:11px}.tabs{margin-bottom:12px}.tabs button{font-size:13px;padding:10px 5px}.surface{padding:14px}.study-head{margin-bottom:9px}.study-stage{grid-template-columns:28px minmax(0,1fr) 28px;gap:4px}.arrow{font-size:34px}.card{height:clamp(250px,calc(100dvh - 275px),540px);border-radius:14px}.card-header{padding:12px 11px 0}.flip-area{padding:10px 17px 49px}.meaning{font-size:15px}.example{font-size:13px;padding:11px 12px}.options{grid-template-columns:1fr;gap:8px}.option{min-height:57px;padding:10px}.quiz-play{padding-bottom:calc(87px + env(safe-area-inset-bottom,0px))}.quiz-actions{position:fixed;z-index:40;bottom:0;left:0;right:0;margin:0;padding:10px 15px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.98);border-top:1px solid #e4e9f2;box-shadow:0 -5px 24px #23395812}.quiz-actions .btn{width:100%;max-width:600px;min-height:51px;margin:auto;font-size:15px}.question{padding:14px;margin-bottom:10px}.question h2{font-size:16px}.form-grid{grid-template-columns:1fr}.manage-tools input{flex-basis:100%}.manage-row{gap:6px}}
</style>

<main class="shell"><div class="intro"><div><p class="eyebrow">SIDE QUEST / BUSINESS VOCABULARY</p><h1>ビジネス横文字100</h1><p class="intro-desc">会議・営業・数字の言葉を、ひとつの場所で覚える。</p></div><span class="count" id="bizCount">100語</span></div>
<nav class="tabs" aria-label="番外編のメニュー"><button type="button" data-tab="study" class="active" aria-pressed="true">▤ 単語帳</button><button type="button" data-tab="quiz" aria-pressed="false">? 4択クイズ</button><button type="button" data-tab="manage" aria-pressed="false">☷ 単語管理</button></nav><section id="bizView" aria-live="polite"></section><p class="footer">広告用語の370語とは別データです。変更はこのブラウザ内に保存されます。</p></main>
<div id="bizNotice" class="message" role="status"></div>
<script>
'use strict';
const DEFAULT_CARDS=[{"id":"biz-001","term":"アジェンダ","definition":"会議で扱う議題と進める順番。","example":"明日の定例会議のアジェンダを先に共有します。","category":"会議・連絡"},{"id":"biz-002","term":"アサイン","definition":"担当業務や役割を人に割り当てること。","example":"新しい案件の窓口に私をアサインしてください。","category":"会議・連絡"},{"id":"biz-003","term":"リスケ","definition":"予定していた日時や計画を組み直すこと。","example":"広告主との打ち合わせを来週にリスケします。","category":"会議・連絡"},{"id":"biz-004","term":"ペンディング","definition":"判断や作業を一時的に保留すること。","example":"報酬条件が未確定なので提案をペンディングにします。","category":"会議・連絡"},{"id":"biz-005","term":"フィックス","definition":"内容や日程を最終的に確定すること。","example":"掲載条件がフィックスしたら媒体に連絡します。","category":"会議・連絡"},{"id":"biz-006","term":"エスカレーション","definition":"自分だけでは判断できない問題を上司や責任者に報告・相談すること。","example":"規約変更の相談が来たので上長にエスカレーションします。","category":"会議・連絡"},{"id":"biz-007","term":"リマインド","definition":"予定や依頼を改めて知らせること。","example":"回答期限の前日に担当者へリマインドします。","category":"会議・連絡"},{"id":"biz-008","term":"フィードバック","definition":"成果や提案について評価や改善点を伝えること。","example":"営業資料にフィードバックをお願いします。","category":"会議・連絡"},{"id":"biz-009","term":"コンセンサス","definition":"関係者の間で意見や方針について合意していること。","example":"新しい手数料率について社内のコンセンサスを得ます。","category":"会議・連絡"},{"id":"biz-010","term":"ブレスト","definition":"自由にアイデアを出し合う話し合い。","example":"新しい提案の切り口をブレストで考えましょう。","category":"会議・連絡"},{"id":"biz-011","term":"ファシリテーション","definition":"会議の進行を助け、話し合いを促すこと。","example":"議論が脱線しないようファシリテーションを担当します。","category":"会議・連絡"},{"id":"biz-012","term":"キックオフ","definition":"新しい案件を始めるときの初回の集まり。","example":"案件開始前に関係者でキックオフを行います。","category":"会議・連絡"},{"id":"biz-013","term":"ネクストアクション","definition":"会議や作業の後、次に実行する具体的な行動。","example":"商談後のネクストアクションは掲載条件の再確認です。","category":"会議・連絡"},{"id":"biz-014","term":"キャッチアップ","definition":"新しい情報や遅れていた状況を把握して追いつくこと。","example":"昨日までの案件の進捗をキャッチアップします。","category":"会議・連絡"},{"id":"biz-015","term":"アナウンス","definition":"決まった内容や変更点を関係者に知らせること。","example":"管理画面の更新予定を媒体へアナウンスします。","category":"会議・連絡"},{"id":"biz-016","term":"アラインメント","definition":"関係者の目的・方針・認識をそろえること。","example":"営業と運用で目標のアラインメントを取ります。","category":"会議・連絡"},{"id":"biz-017","term":"ナレッジ","definition":"業務で得た知識・経験・ノウハウ。","example":"媒体審査で得たナレッジをチームで共有します。","category":"会議・連絡"},{"id":"biz-018","term":"エビデンス","definition":"説明や判断の根拠になる証拠・資料・記録。","example":"成果の発生状況を示すエビデンスを保存します。","category":"会議・連絡"},{"id":"biz-019","term":"ステークホルダー","definition":"案件に関係し、影響を受ける人や組織。","example":"変更前に主要なステークホルダーに確認します。","category":"会議・連絡"},{"id":"biz-020","term":"レポーティング","definition":"業務の状況や成果を整理して報告すること。","example":"週次のレポーティングで獲得件数の変化を説明します。","category":"会議・連絡"},{"id":"biz-021","term":"タスク","definition":"達成するために行う個々の作業。","example":"今日中に対応するタスクを3件整理します。","category":"業務進行"},{"id":"biz-022","term":"デッドライン","definition":"作業や提出を終えなければならない期限。","example":"資料提出のデッドラインは金曜日です。","category":"業務進行"},{"id":"biz-023","term":"マイルストーン","definition":"計画途中で達成状況を確認する重要な節目。","example":"今月末を媒体10社獲得のマイルストーンにします。","category":"業務進行"},{"id":"biz-024","term":"ガントチャート","definition":"作業の予定と進捗を横棒で示す管理表。","example":"ガントチャートで案件公開までの予定を確認します。","category":"業務進行"},{"id":"biz-025","term":"WBS","definition":"仕事を小さな作業単位に分けた一覧や構成表。","example":"WBSを作り、案件公開に必要な作業を洗い出します。","category":"業務進行"},{"id":"biz-026","term":"リードタイム","definition":"依頼や発注から完了までにかかる時間。","example":"素材の制作リードタイムを確認して納期を決めます。","category":"業務進行"},{"id":"biz-027","term":"ボトルネック","definition":"全体の進行や成果を妨げている要因や工程。","example":"審査待ちが掲載開始のボトルネックです。","category":"業務進行"},{"id":"biz-028","term":"プライオリティ","definition":"複数の仕事を行う際の優先順位。","example":"緊急の問い合わせのプライオリティを上げます。","category":"業務進行"},{"id":"biz-029","term":"リソース","definition":"仕事に使える人員・時間・予算などの資源。","example":"新案件を増やす前に運用のリソースを確認します。","category":"業務進行"},{"id":"biz-030","term":"キャパシティ","definition":"人や組織が対応できる業務量の限界や余力。","example":"今週はチームのキャパシティに余裕がありません。","category":"業務進行"},{"id":"biz-031","term":"ロードマップ","definition":"目標達成までの大まかな計画と時系列。","example":"サービス改善のロードマップを共有します。","category":"業務進行"},{"id":"biz-032","term":"スコープ","definition":"業務やプロジェクトで対応する範囲。","example":"今回の提案のスコープは新規媒体の開拓までです。","category":"業務進行"},{"id":"biz-033","term":"スコープクリープ","definition":"途中で合意した業務範囲が少しずつ広がること let words=[],key='',tab='study',order=[],idx=0,front=false,startSide='back',search='',selected='',editing=null,quiz={phase:'setup',n:10,ids:[],index:0,choices:[],chosen:null,answers:[]};
function alertUser(s){$('bizNotice').textContent=s;$('bizNotice').classList.add('show');setTimeout(()=>$('bizNotice').classList.remove('show'),2800)}
function clean(c){if(!c||typeof c!=='object')return null;const term=String(c.term||'').trim().slice(0,100),definition=String(c.definition||'').trim().slice(0,1500);return term&&definition?{id:String(c.id||'biz-new').slice(0,100),term,definition,example:String(c.example||'').slice(0,1200),category:String(c.category||CATEGORY_OPTIONS[0]).slice(0,60)}:null}
function start(){let profile='default';try{profile=JSON.parse(localStorage.getItem('adterms-lab-profiles-v3')||'null')?.selected||'default'}catch(e){}key='adterms-lab-business-v1-'+profile;try{const raw=localStorage.getItem(key);if(raw===null){words=DEFAULT_CARDS.map(c=>({...c}));localStorage.setItem(key,JSON.stringify(words))}else{const arr=JSON.parse(raw);if(!Array.isArray(arr)||arr.length>1000||arr.some(c=>!clean(c)))throw Error('bad data');words=arr.map(clean)}}catch(e){words=DEFAULT_CARDS.map(c=>({...c}));alertUser('保存データが読めなかったため初期データを表示しています。')}render()}
function store(next){if(next.length>1000||next.some(c=>!clean(c)))return alertUser('入力データを確認してください'),false;try{localStorage.setItem(key,JSON.stringify(next.map(clean)));words=next.map(clean);order=[];return true}catch(e){alertUser('保存できませんでした');return false}}
function mask(c){const all=[c.term,c.term.replace(/[（(].*$/,'').trim(),...Array.from(c.term.matchAll(/[（(]([^）)]+)[）)]/g),m=>m[1])].filter(Boolean);const reserved='\\.^$*+?()[]{}|';const safe=t=>[...t].map(ch=>reserved.includes(ch)?'\\'+ch:ch).join('');const rx=new RegExp([...new Set(all)].sort((a,b)=>b.length-a.length).map(safe).join('|'),'gi');let out='',pos=0;for(const m of c.example.matchAll(rx)){out+=esc(c.example.slice(pos,m.index))+'<span class="mask">？？？</span>';pos=m.index+m[0].length}return out+esc(c.example.slice(pos))}
function render(){$('bizCount').textContent=words.length+'語';document.querySelectorAll('.tabs [data-tab]').forEach(b=>{const v=b.dataset.tab===tab;b.classList.toggle('active',v);b.setAttribute('aria-pressed',String(v))});if(tab==='study')study();else if(tab==='quiz')quizPage();else manage()}
function open(t){if(!['study','quiz','manage'].includes(t))return;tab=t;editing=null;render();scrollTo({top:0,behavior:'instant'})}
function study(){if(order.length!==words.length||order.some(id=>!find(id))){order=mix(words.map(c=>c.id));idx=0;front=startSide==='front'}if(!order.length){$('bizView').innerHTML='<div class="surface">単語がありません。単語管理から追加できます。</div>';return}const c=find(order[idx]);const contents=front?'<div class="term-center">'+esc(c.term)+'</div>':'<div class="clue">意味</div><div class="meaning">'+esc(c.definition)+'</div>'+(c.example?'<div class="clue" style="margin-top:21px">実務での例文</div><div class="example">'+mask(c)+'</div>':'');$('bizView').innerHTML='<div class="study-head"><strong>'+(idx+1)+' / '+order.length+'</strong><button class="btn ghost" data-do="shuffle">↻ シャッフル</button></div><div class="study-stage"><button class="arrow" data-do="prev" aria-label="前の単語へ" '+(idx===0?'disabled':'')+'>‹</button><article class="card '+(front?'front':'back')+'"><div class="card-header"><span class="pill">'+esc(c.category)+'</span><small>'+(front?'表':'裏')+'</small></div><div class="flip-area" data-do="flip" role="button" tabindex="0" aria-label="カードをめくる" aria-keyshortcuts="Enter Space">'+contents+'</div><span class="hint">'+(front?'タップで意味を見る':'タップで単語を見る')+'</span></article><button class="arrow" data-do="next" aria-label="次の単語へ" '+(idx>=order.length-1?'disabled':'')+'>›</button></div><div class="study-bar"><span class="mode-label">開始面</span><div class="segment"><button data-do="side" data-value="back" class="'+(startSide==='back'?'active':'')+'">意味から</button><button data-do="side" data-value="front" class="'+(startSide==='front'?'active':'')+'">単語から</button></div></div>'}
function move(n){if(idx+n<0||idx+n>=order.length)return;idx+=n;front=startSide==='front';study()}
function flip(){
 if(tab!=='study'||!order.length)return;
 front=!front;
 study();
}
function beginQuiz(){if(words.length<4)return alertUser('クイズには4語以上必要です');const n=Math.min(Number($('quizCount').value)||10,words.length);quiz={phase:'play',n,ids:mix(words.map(c=>c.id)).slice(0,n),index:0,choices:[],chosen:null,answers:[]};choices();quizPage()}
function choices(){const answer=find(quiz.ids[quiz.index]);if(!answer){quiz.phase='done';return}const same=mix(words.filter(w=>w.id!==answer.id&&w.category===answer.category)).slice(0,3);if(same.length<3)same.push(...mix(words.filter(w=>w.id!==answer.id&&!same.some(c=>c.id===w.id))).slice(0,3-same.length));quiz.choices=mix([answer,...same]);quiz.chosen=null}
function quizPage(){if(quiz.phase==='setup'){$('bizView').innerHTML='<div class="surface" style="max-width:600px;margin:auto"><h2>4択クイズ</h2><p class="muted">説明から用語を選ぼう。結果画面でまとめて復習できるよ。</p><div class="field"><label>問題数</label><select id="quizCount">'+[10,20,50,100].filter(n=>n<=words.length).map(n=>'<option value="'+n+'">'+n+'問</option>').join('')+(words.length&&![10,20,50,100].includes(words.length)?'<option value="'+words.length+'">全件 ('+words.length+')</option>':'')+'</select></div><button class="btn primary" style="width:100%" data-do="quizStart">クイズを始める</button></div>';return}if(quiz.phase==='done')return result();const c=find(quiz.ids[quiz.index]),answered=quiz.chosen!==null;if(!c){quiz.phase='done';return result()}$('bizView').innerHTML='<div class="surface quiz-play"><div class="study-head"><strong>'+(quiz.index+1)+' / '+quiz.ids.length+' 問</strong><button class="btn ghost" data-do="quizFinish">終了</button></div><div class="question"><div class="clue">この説明に当てはまる用語は？</div><h2>'+esc(c.definition)+'</h2></div><div class="options">'+quiz.choices.map((o,i)=>{const good=answered&&o.id===c.id,bad=answered&&o.id===quiz.chosen&&o.id!==c.id;return '<button class="option '+(good?'right':bad?'wrong':'')+'" data-do="answer" data-id="'+esc(o.id)+'" '+(answered?'disabled':'')+'><span class="letter">'+('ABCD'[i])+'</span><span class="option-text">'+esc(o.term)+'</span>'+(good||bad?'<span class="symbol">'+(good?'○':'×')+'</span>':'')+'</button>'}).join('')+'</div><div class="quiz-actions"><button class="btn '+(answered?'primary':'')+'" data-do="'+(answered?'advance':'skip')+'">'+(answered?(quiz.index===quiz.ids.length-1?'結果を見る':'次へ →'):'スキップ →')+'</button></div></div>'}
function answer(id){if(quiz.phase!=='play'||quiz.chosen!==null||!quiz.choices.some(c=>c.id===id))return;quiz.chosen=id;quiz.answers.push({id:quiz.ids[quiz.index],selected:id,status:id===quiz.ids[quiz.index]?'correct':'incorrect'});quizPage()}
function next(skipped){if(quiz.phase!=='play')return;if(skipped&&quiz.chosen===null)quiz.answers.push({id:quiz.ids[quiz.index],selected:null,status:'skipped'});else if(quiz.chosen===null)return;quiz.index++;if(quiz.index>=quiz.ids.length)quiz.phase='done';else choices();quizPage();scrollTo({top:0,behavior:'instant'})}
function finish(){if(quiz.phase!=='play')return;if(quiz.chosen===null)quiz.answers.push({id:quiz.ids[quiz.index],selected:null,status:'skipped'});quiz.phase='done';quizPage()}
function result(){const a=quiz.answers,good=a.filter(x=>x.status==='correct').length,bad=a.filter(x=>x.status==='incorrect').length,skip=a.filter(x=>x.status==='skipped').length;$('bizView').innerHTML='<div class="surface"><h2>クイズ結果</h2><div class="quiz-scores"><div class="score good"><strong>'+good+'</strong>正解</div><div class="score bad"><strong>'+bad+'</strong>不正解</div><div class="score skip"><strong>'+skip+'</strong>スキップ</div></div><div class="controls"><button class="btn primary" data-do="quizReset">もう一度</button><button class="btn" data-tab="study">単語帳へ</button></div><div class="review-list">'+a.map((x,i)=>{const c=find(x.id),picked=find(x.selected);if(!c)return '';const cl=x.status==='correct'?'good':x.status==='incorrect'?'bad':'skip',status=x.status==='correct'?'○ 正解':x.status==='incorrect'?'× 不正解':'– スキップ';return '<div class="review-row '+cl+'"><span class="status">'+status+'</span><strong>'+(i+1)+'. '+esc(c.term)+'</strong><p>'+esc(c.definition)+'</p>'+(x.status==='incorrect'&&picked?'<p>選択した単語：'+esc(picked.term)+'</p>':'')+'</div>'}).join('')+'</div></div>'}
function manage(){if(editing!==null)return editor();$('bizView').innerHTML='<div class="surface"><div class="manage-top"><h2>単語管理</h2><button class="btn primary" data-do="add">＋ 追加</button></div><div class="manage-tools"><input type="search" id="searchTerms" placeholder="単語・意味・例文を検索" value="'+esc(search)+'"><button class="btn" data-do="export">バックアップ</button><button class="btn" data-do="import">読み込み</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><div id="preview"></div><p class="muted" id="termCount"></p><div class="manage-list" id="termsList"></div><div class="controls" style="margin-top:16px"><button class="btn ghost" data-do="restore">初期100語の不足分を復元</button></div></div>';list();preview()}
function list(){const target=$('termsList');if(!target)return;const q=search.toLocaleLowerCase('ja'),shown=words.filter(c=>!q||[c.term,c.definition,c.example,c.category].some(v=>v.toLocaleLowerCase('ja').includes(q)));$('termCount').textContent=shown.length+'件 / 全'+words.length+'語';target.innerHTML=shown.map(c=>'<div class="manage-row"><button class="manage-term" data-do="inspect" data-id="'+esc(c.id)+'"><strong>'+esc(c.term)+'</strong><small>'+esc(c.category)+' · '+esc(c.definition.slice(0,70))+'</small></button><div class="actions"><button class="icon-btn" data-do="edit" data-id="'+esc(c.id)+'" aria-label="編集">✎</button><button class="icon-btn danger" data-do="delete" data-id="'+esc(c.id)+'" aria-label="削除">×</button></div></div>').join('')||'<p class="muted">該当する単語がありません。</p>'}
function preview(){const target=$('preview'),c=find(selected);if(!target)return;target.innerHTML=c?'<div class="manage-preview"><div class="controls" style="justify-content:space-between"><span class="pill">'+esc(c.category)+'</span><button class="btn ghost" data-do="closePreview">閉じる ×</button></div><h3>'+esc(c.term)+'</h3><p>'+esc(c.definition)+'</p>'+(c.example?'<div class="clue">実務での例文</div><p>'+esc(c.example)+'</p>':'')+'<button class="btn" data-do="edit" data-id="'+esc(c.id)+'">編集する</button></div>':''}
function editor(){const c=find(editing),fresh=editing==='new';if(!fresh&&!c){editing=null;return manage()}$('bizView').innerHTML='<div class="surface"><div class="manage-top"><h2>'+(fresh?'単語を追加':'単語を編集')+'</h2><button class="btn ghost" data-do="cancel">← 一覧へ</button></div><form id="editForm"><div class="field"><label>単語名 *</label><input id="editTerm" required maxlength="100" value="'+esc(c?.term||'')+'"></div><div class="field"><label>意味 *</label><textarea id="editDefinition" required maxlength="1500">'+esc(c?.definition||'')+'</textarea></div><div class="field"><label>実務での例文</label><textarea id="editExample" maxlength="1200">'+esc(c?.example||'')+'</textarea></div><div class="field"><label>カテゴリ</label><select id="editCategory">'+CATEGORY_OPTIONS.map(v=>'<option value="'+esc(v)+'" '+(v===(c?.category||CATEGORY_OPTIONS[0])?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div><div class="controls"><button class="btn primary" type="submit">保存する</button><button class="btn" data-do="cancel">キャンセル</button></div></form></div>'}
function saveEdit(e){e.preventDefault();const term=$('editTerm').value.trim(),definition=$('editDefinition').value.trim(),example=$('editExample').value.trim(),category=$('editCategory').value;if(!term||!definition)return alertUser('単語名・意味を入力してください');if(words.some(c=>c.id!==editing&&c.term===term))return alertUser('同名の単語があります');const c=find(editing),id=c?.id||'biz-user-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),item={id,term,definition,example,category};if(store(c?words.map(x=>x.id===id?item:x):[...words,item])){editing=null;selected=id;manage();alertUser('保存しました')}}
function exportData(){const blob=new Blob([JSON.stringify({app:'AdTerms Lab ビジネス横文字100',cards:words},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ビジネス横文字100_バックアップ.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3500)}
async function importData(file){if(!file||file.size>2e6)return alertUser('2MB以下のJSONを選んでください');try{const d=JSON.parse(await file.text());if(d.app!=='AdTerms Lab ビジネス横文字100'||!Array.isArray(d.cards)||d.cards.some(c=>!clean(c)))throw Error('bad');const w=d.cards.map(clean);if(new Set(w.map(c=>c.id)).size!==w.length||new Set(w.map(c=>c.term)).size!==w.length)throw Error('duplicate');if(confirm(w.length+'語で番外編の単語を置き換えますか？')&&store(w)){selected='';quiz.phase='setup';render();alertUser('読み込みました')}}catch(e){alertUser('バックアップが読み込めませんでした')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){open(t.dataset.tab);return}const b=e.target.closest('[data-do]');if(!b)return;const a=b.dataset.do,id=b.dataset.id;if(a==='prev')move(-1);else if(a==='next')move(1);else if(a==='flip'){flip()}else if(a==='shuffle'){order=mix(words.map(c=>c.id));idx=0;front=startSide==='front';study()}else if(a==='side'){startSide=b.dataset.value;front=startSide==='front';study()}else if(a==='quizStart')beginQuiz();else if(a==='answer')answer(id);else if(a==='advance')next(false);else if(a==='skip')next(true);else if(a==='quizFinish')finish();else if(a==='quizReset'){quiz.phase='setup';quizPage()}else if(a==='inspect'){selected=id;preview()}else if(a==='closePreview'){selected='';preview()}else if(a==='add'){editing='new';editor()}else if(a==='edit'){editing=id;editor()}else if(a==='cancel'){editing=null;manage()}else if(a==='delete'){const c=find(id);if(c&&confirm('「'+c.term+'」を削除しますか？')&&store(words.filter(x=>x.id!==id))){if(selected===id)selected='';manage();alertUser('削除しました')}}else if(a==='restore'){const old=new Set(words.map(c=>c.term)),missing=DEFAULT_CARDS.filter(c=>!old.has(c.term));if(!missing.length)return alertUser('初期100語はすべて登録済みです');if(confirm(missing.length+'語を追加しますか？')&&store([...words,...missing])){manage();alertUser('復元しました')}}else if(a==='export')exportData();else if(a==='import')$('importFile')?.click()});
document.addEventListener('submit',e=>{if(e.target.id==='editForm')saveEdit(e)});
document.addEventListener('input',e=>{if(e.target.id==='searchTerms'){search=e.target.value;list()}});
document.addEventListener('change',async e=>{if(e.target.id==='importFile'){const file=e.target.files?.[0];e.target.value='';if(file)await importData(file)}});
document.addEventListener('keydown',e=>{
 if(tab!=='study'||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.isComposing||
   e.target.closest('input,textarea,select,[contenteditable]'))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
  e.preventDefault();
  move(e.key==='ArrowLeft'?-1:1);
  return;
 }
 // Enter and Space flip the card, including when the card itself has focus.
 // Preserve normal keyboard activation of buttons, links and other controls.
 if((e.key==='Enter'||e.key===' '||e.code==='Space')&&
   !e.target.closest('button,a,summary,[role="combobox"]')){
  e.preventDefault();
  if(!e.repeat)flip();
 }
});
start();
</script>
</body>
</html>
